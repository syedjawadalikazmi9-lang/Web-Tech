<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Professional Multi-Page Website</title>
    <link rel="icon" href="assets/images/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex flex-col min-h-screen">

    <!-- Header & Navigation -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="text-2xl font-bold text-indigo-600">BrandLogo</div>
            <ul class="flex space-x-6 font-medium">
                <li><a href="index.html" class="hover:text-indigo-600 transition">Home</a></li>
                <li><a href="about.html" class="hover:text-indigo-600 transition">About</a></li>
                <li><a href="contact.html" class="hover:text-indigo-600 transition">Contact</a></li>
                <li><a href="signin.html" class="text-indigo-600">Sign In</a></li>
                <li><a href="signup.html" class="hover:text-indigo-600 transition">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow flex items-center justify-center py-12 px-4">
        <section class="max-w-md w-full bg-white p-8 rounded-xl shadow-sm border">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-extrabold text-gray-900">Welcome Back</h1>
                <p class="text-sm text-gray-600 mt-2">Please sign in to your account</p>
            </div>

            <form action="#" method="POST" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                    <input type="email" id="email" name="email" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input type="password" id="password" name="password" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition">Sign In</button>
            </form>

            <p class="text-center text-sm text-gray-600 mt-6">
                Don't have an account? <a href="signup.html" class="text-indigo-600 font-semibold hover:underline">Sign Up</a>
            </p>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-8">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p>&copy; 2026 BrandLogo. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
