<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Professional Multi-Page Website</title>
    <link rel="icon" href="assets/images/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex flex-col min-h-screen">

    <!-- Header & Navigation -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="text-2xl font-bold text-indigo-600">BrandLogo</div>
            <ul class="flex space-x-6 font-medium">
                <li><a href="index.html" class="hover:text-indigo-600 transition">Home</a></li>
                <li><a href="about.html" class="hover:text-indigo-600 transition">About</a></li>
                <li><a href="contact.html" class="text-indigo-600">Contact</a></li>
                <li><a href="signin.html" class="hover:text-indigo-600 transition">Sign In</a></li>
                <li><a href="signup.html" class="hover:text-indigo-600 transition">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow py-16">
        <section class="max-w-3xl mx-auto px-4">
            <div class="text-center mb-10">
                <h1 class="text-4xl font-extrabold text-gray-900 mb-2">Get in Touch</h1>
                <p class="text-gray-600">Have questions? Fill out the form below to send us a message.</p>
            </div>

            <!-- Functional Contact Form with Formspree -->
            <form action="https://formspree.io/f/your_form_id" method="POST" class="bg-white p-8 rounded-xl shadow-sm border space-y-6">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                    <input type="text" id="name" name="name" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                    <input type="email" id="email" name="email" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label for="message" class="block text-sm font-medium text-gray-700 mb-2">Message</label>
                    <textarea id="message" name="message" rows="5" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition">Send Message</button>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-8 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p>&copy; 2026 BrandLogo. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
